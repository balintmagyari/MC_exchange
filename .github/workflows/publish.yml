name: Publish to PyPI

# Trigger the workflow when you publish a new GitHub Release
on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build and publish MC-exchange to PyPI
    runs-on: ubuntu-latest
    
    # Must match the environment name configured in PyPI and GitHub
    environment: pypi
      
    # CRITICAL: id-token: write is required for OIDC Trusted Publishing
    permissions:
      id-token: write  
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build the package (sdist and wheel)
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API tokens or passwords are required!